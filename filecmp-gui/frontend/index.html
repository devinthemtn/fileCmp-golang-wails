<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8"/>
    <meta content="width=device-width, initial-scale=1.0" name="viewport"/>
    <title>File Compare</title>
</head>
<body>
<div id="app">
    <header class="topbar">
        <div class="mode-tabs">
            <button class="mode-tab active" data-mode="paths">Files / Directories</button>
            <button class="mode-tab" data-mode="git">Git</button>
        </div>

        <div class="path-form" id="paths-form">
            <div class="path-field">
                <label>Left</label>
                <div class="path-input-row">
                    <div class="autocomplete">
                        <input type="text" id="left-path" placeholder="Path to file or directory…" autocomplete="off"/>
                        <div class="suggestions" id="left-suggestions"></div>
                    </div>
                    <button class="btn btn-ghost" id="left-browse-file" title="Choose file">File…</button>
                    <button class="btn btn-ghost" id="left-browse-dir" title="Choose directory">Dir…</button>
                </div>
            </div>
            <button class="btn btn-icon" id="swap-paths" title="Swap left and right">⇄</button>
            <div class="path-field">
                <label>Right</label>
                <div class="path-input-row">
                    <div class="autocomplete">
                        <input type="text" id="right-path" placeholder="Path to file or directory…" autocomplete="off"/>
                        <div class="suggestions" id="right-suggestions"></div>
                    </div>
                    <button class="btn btn-ghost" id="right-browse-file" title="Choose file">File…</button>
                    <button class="btn btn-ghost" id="right-browse-dir" title="Choose directory">Dir…</button>
                </div>
            </div>
            <button class="btn btn-primary" id="compare-btn">Compare</button>
        </div>

        <div class="git-form hidden" id="git-form">
            <div class="path-field">
                <label>Left ref</label>
                <input type="text" id="left-ref" placeholder="HEAD" value="HEAD" autocomplete="off"/>
            </div>
            <div class="path-field">
                <label>Right ref <span class="hint">(blank = working tree)</span></label>
                <input type="text" id="right-ref" placeholder="working tree" autocomplete="off"/>
            </div>
            <button class="btn btn-primary" id="git-compare-btn">Compare</button>
        </div>
    </header>

    <div class="main">
        <aside class="sidebar">
            <div class="sidebar-header">
                <input type="text" id="filter-input" placeholder="Filter files…" autocomplete="off"/>
                <button class="btn btn-ghost btn-small" id="copy-files-btn" disabled title="Copy unique files between directories">Copy…</button>
            </div>
            <div class="file-list" id="file-list">
                <div class="empty-state">Load a comparison to see files here.</div>
            </div>
        </aside>

        <section class="content">
            <div class="content-header" id="content-header">
                <div class="empty-state">Nothing loaded yet — enter two paths (or a git ref) above and press Compare.</div>
            </div>
            <div class="content-body" id="content-body"></div>
        </section>
    </div>

    <footer class="statusbar">
        <span id="status-message"></span>
    </footer>

    <div class="modal-overlay hidden" id="copy-modal">
        <div class="modal">
            <div class="modal-header">
                <h2>Copy unique files</h2>
                <button class="btn btn-icon" id="copy-modal-close">✕</button>
            </div>
            <div class="modal-toolbar">
                <div class="segmented" id="copy-target-toggle">
                    <button class="segmented-btn active" data-target="to-right">Left → Right</button>
                    <button class="segmented-btn" data-target="to-left">Right → Left</button>
                </div>
                <div class="modal-toolbar-actions">
                    <button class="btn btn-ghost btn-small" id="copy-select-all">Select all</button>
                    <button class="btn btn-ghost btn-small" id="copy-select-none">Select none</button>
                </div>
            </div>
            <div class="modal-body" id="copy-file-list"></div>
            <div class="modal-footer">
                <span id="copy-summary" class="hint"></span>
                <button class="btn btn-primary" id="copy-execute-btn">Copy selected</button>
            </div>
        </div>
    </div>
</div>
<script src="./src/main.js" type="module"></script>
</body>
</html>
